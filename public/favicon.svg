<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Gargantua's silhouette, and the silhouette is the point.

       The obvious icon for a black hole is a bright annulus with a bar through
       it, and the obvious icon is wrong: a ring of even weight with a line
       across it is a roundel, not a black hole. What separates the two is that
       the disk does not stop at the halo — it runs *out past* it and tapers to
       points that leave the frame, so the outline sits landscape inside its
       square and reads as a hat rather than a badge.

       Three layers, in the order light reaches the camera: the disk seen
       edge-on, wide and tapering; the far side of it lensed up over the shadow
       and closed into a halo underneath; and the near side crossing in front,
       below centre because the camera sits above the disk plane.

       The halo has to close under the shadow or the void stops reading as a
       void, and the wings have to carry real weight or the mark collapses back
       into a ring. It needs both, or it is a roundel or a mushroom.

       Palette is the disk's own, measured off the film: a white core falling
       to salmon, never to amber. Nothing is finer than ~1.5 device pixels at a
       16px render, and every size from 16 up was judged as a true
       rasterisation rather than a scaled-down preview — they do not look
       alike, and the small ones are the ones that matter. -->
  <defs>
    <!-- the lensed halo: blazing where it crosses the disk plane, falling away
         over the top and under the bottom -->
    <linearGradient id="halo" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0"   stop-color="#b26a51"/>
      <stop offset=".28" stop-color="#ecc2ae"/>
      <stop offset=".5"  stop-color="#fff8f4"/>
      <stop offset=".72" stop-color="#f0c9b6"/>
      <stop offset="1"   stop-color="#c07456"/>
    </linearGradient>
    <!-- the disk edge-on. Held opaque right out to the tips: fade it early and
         the points turn into blunt stubs and the silhouette goes round again -->
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#a2604a"/>
      <stop offset=".14" stop-color="#cd8663"/>
      <stop offset=".5"  stop-color="#fff7f3"/>
      <stop offset=".86" stop-color="#cd8663"/>
      <stop offset="1"   stop-color="#a2604a"/>
    </linearGradient>
    <!-- the near side, crossing in front of everything -->
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#b06a50" stop-opacity=".5"/>
      <stop offset=".26" stop-color="#fff4ef"/>
      <stop offset=".74" stop-color="#fff4ef"/>
      <stop offset="1"   stop-color="#b06a50" stop-opacity=".5"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="6" fill="#05060a"/>
  <ellipse cx="16" cy="16.6" rx="16" ry="5.3" fill="url(#wing)"/>
  <circle cx="16" cy="16" r="11.7" fill="url(#halo)"/>
  <circle cx="16" cy="16" r="7.9" fill="#05060a"/>
  <circle cx="16" cy="16" r="8.3" fill="none" stroke="#fffcfa" stroke-width="0.85"/>
  <ellipse cx="16" cy="17.9" rx="16" ry="1.3" fill="url(#front)"/>
</svg>
