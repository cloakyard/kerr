<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The frame's signature, in four shapes and painted in the order light
       actually reaches you: the far side of the disk lensed into a ring, the
       shadow punched out of it, then the near side crossing in front.
       Nothing is finer than ~1.5 device pixels at a 16px render. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#ffa94d"/>
      <stop offset=".5" stop-color="#fff8ec"/>
      <stop offset="1" stop-color="#ffa94d"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f3d" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#fffaf2"/>
      <stop offset="1" stop-color="#ff9f3d" stop-opacity=".5"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="#06070c"/>
  <circle cx="16" cy="16" r="11" fill="url(#ring)"/>
  <circle cx="16" cy="16" r="7.9" fill="#06070c"/>
  <ellipse cx="16" cy="17.7" rx="15.8" ry="1.75" fill="url(#disk)"/>
</svg>
